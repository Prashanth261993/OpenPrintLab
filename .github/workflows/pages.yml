name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional validation tools
        run: python -m pip install -e ".[mcp,test]"
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Check committed exports without regenerating
        run: python -m tools.release --check
      - name: Unit and catalog checks
        run: python -m unittest discover -s tests -v
      - name: MCP stdio integration
        run: python -m tests.mcp_smoke
      - name: Website and browser checks
        run: python -m tests.browser_smoke
      - name: Upload Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
