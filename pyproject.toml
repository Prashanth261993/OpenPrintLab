[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "openprintlab"
version = "0.1.0"
description = "Local, reproducible starter models for beginner 3D printing"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
test = ["playwright==1.64.1"]
cadquery = ["cadquery==2.8.0"]

[project.scripts]
openprintlab = "tools.cli:main"
openprintlab-mcp = "tools.mcp_server:main"

[tool.setuptools]
packages = ["tools", "models"]

[tool.setuptools.package-data]
models = ["catalog.json", "templates.json"]
